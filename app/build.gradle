plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.ryuya.darkapps'
    compileSdk 37
    buildToolsVersion '37.0.0'
    defaultConfig {
        applicationId 'dev.ryuya.darkapps'
        minSdk 36
        targetSdk 37
        versionCode 11
        versionName '0.3.1-experimental'
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
    }
}
dependencies {
    implementation 'io.github.libxposed:service:102.0.0'

    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}
tasks.register('writeRuntimeDependencyList') {
    doLast {
        def entries = configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts
                .collect { it.moduleVersion.id.toString() }
                .unique()
                .sort()
        def output = file('build/runtime-dependencies.txt')
        output.parentFile.mkdirs()
        output.text = entries.join('\n') + '\n'
    }
}
